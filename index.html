<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bağcılar Belediyesi - Dahili Rehber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 98%;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 25px;
        }

        .search-input {
            width: 100%;
            padding: 14px 45px 14px 16px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .clear-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: #94a3b8;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
            font-weight: bold;
        }

        .clear-btn:hover {
            background: #64748b;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border: 1px solid #cbd5e1; /* Tam kılavuz çizgileri */
            white-space: nowrap; /* Satır taşmasını önler, tek satır yapar */
        }

        th {
            background-color: #3b82f6;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #f1f5f9;
        }

        .no-result {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Bağcılar Belediyesi Rehber Bilgileri</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Ara (Ad, Birim veya Ünvan yazın...)">
        <button id="clearBtn" class="clear-btn">&times;</button>
    </div>

    <div class="table-wrapper">
        <table id="rehberTable">
            <thead>
                <tr>
                    <th style="width: 12%;">Dahili No</th>
                    <th style="width: 28%;">Ad Soyad</th>
                    <th style="width: 30%;">Birim</th>
                    <th style="width: 30%;">Ünvan</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
        <div id="noResult" class="no-result">Aradığınız kriterlere uygun personel bulunamadı.</div>
    </div>
</div>

<script>
    let rehberVerisi = [];

    // Veriyi Çekme
    fetch('rehber.json')
        .then(response => response.json())
        .then(data => {
            // Herhangi bir otomatik sıralama yapmıyoruz, Excel sırasını koruyoruz.
            rehberVerisi = data;
            tabloyuDoldur(rehberVerisi);
        })
        .catch(error => console.error('Veri yüklenirken hata oluştu:', error));

    function tabloyuDoldur(data) {
        const tbody = document.getElementById('tableBody');
        const noResult = document.getElementById('noResult');
        tbody.innerHTML = '';

        if (data.length === 0) {
            noResult.style.display = 'block';
            return;
        } else {
            noResult.style.display = 'none';
        }

        data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight: 600; color: #1e3a8a;">${item.dahili || ''}</td>
                <td style="font-weight: 500;">${item.isim || ''}</td>
                <td>${item.birim || ''}</td>
                <td>${item.unvan || ''}</td>
            `;
            tbody.appendChild(row);
        });
    }

    // Arama Fonksiyonu
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    searchInput.addEventListener('input', function() {
        const katsayi = this.value.toLowerCase().trim();
        
        // Temizleme butonunun görünürlüğü
        if (katsayi.length > 0) {
            clearBtn.style.display = 'flex';
        } else {
            clearBtn.style.display = 'none';
        }

        const filtreliData = rehberVerisi.filter(item => {
            const isim = (item.isim || '').toLowerCase();
            const birim = (item.birim || '').toLowerCase();
            const unvan = (item.unvan || '').toLowerCase();
            const dahili = (item.dahili || '').toLowerCase();

            return isim.includes(katsayi) || birim.includes(katsayi) || unvan.includes(katsayi) || dahili.includes(katsayi);
        });

        tabloyuDoldur(filtreliData);
    });

    // X Butonuna Basınca Temizleme
    clearBtn.addEventListener('click', function() {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        tabloyuDoldur(rehberVerisi);
        searchInput.focus();
    });
</script>

</body>
</html>
